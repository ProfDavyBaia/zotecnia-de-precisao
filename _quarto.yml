project:
  type: website
  render:
    - "*.qmd"
    - "aulas/**/*.qmd"

# engine jupyter: necessário porque a disciplina usa blocos ```{python}```
# (dados e gráficos)
engine: jupyter

website:
  title: "Zootecnia de Precisão"
  description: "UFAL - Campus CECA, Rio Largo"
  navbar:
    left:
      # links âncora para as seções da página única (index.qmd)
      - href: index.qmd
        text: Início
      - href: index.qmd#aulas
        text: Aulas
      - href: index.qmd#ementa
        text: Ementa
      #- href: index.qmd#cronograma
        #text: Cronograma
      - href: index.qmd#avaliacao
        text: Avaliação
      - href: index.qmd#bibliografia
        text: Bibliografia
    right:
      - icon: github
        href: "https://github.com/profdavybaia/zotecnia-de-precisao"
        text: Repositório

format:
  html:
    theme:
      light: flatly # tema claro
      dark: darkly # tema escuro — a navbar ganha um botão de alternância automática
    css: styles.css
    toc: false
    page-layout: full
